name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby -c Formula/nvoip-shell.rb
      - run: brew tap nvoip/tap "$GITHUB_WORKSPACE"
      - run: brew audit --strict --online nvoip/tap/nvoip-shell
      - run: brew install --build-from-source nvoip/tap/nvoip-shell
      - run: brew test nvoip/tap/nvoip-shell
